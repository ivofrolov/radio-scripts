[project]
name = "radioscripts"
authors = [{ name="Ivan Frolov", email="ivofrolov@fastmail.com" }]
description = "Console application to compile Radio Music eurorack module compatible stations from UbuWeb Sound catalog"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/ivofrolov/radio-scripts"
Issues = "https://github.com/ivofrolov/radio-scripts/issues"

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]
